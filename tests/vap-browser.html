<!doctype html><meta charset="utf-8"><title>VAP lifecycle regression harness</title>
<style>body{font:14px system-ui;margin:24px;color:#423452}section{display:flex;gap:20px}article{width:48%}.host{width:100%;height:240px;background:#eee;display:grid;place-items:center}.host canvas{width:100%!important;height:auto!important}button{padding:9px;margin:6px}pre{white-space:pre-wrap}#metrics{font:13px monospace}@media(max-width:600px){section{display:block}article{width:100%}}</style>
<h1>VAP regression harness</h1><p>Original engine vs MotionScope frame driver. The counters count actual GL draw calls, including when paused.</p>
<div><button id="load">Load both</button><button id="play">Play both</button><button id="pause">Pause both</button><button id="seek">Seek fixed to 5s</button><button id="snapshot">Snapshot fixed</button><button id="replace">Replace fixed text</button><button id="destroy">Dispose both</button></div>
<section><article><h2>Upstream / original scheduling</h2><div class="host" id="baseline"></div></article><article><h2>Fixed adapter</h2><div class="host" id="fixed"></div></article></section><pre id="metrics">Ready</pre><pre id="result" role="status"></pre>
<script type="module">
import Vap from 'video-animation-player/src/index.ts';
import {videoAdapter} from '../src/adapters/video.js';
const $=id=>document.getElementById(id);let baseline,fixed,urls=[],baselineDraws=0;
let files;async function sample(){if(!files)files=await Promise.all(['vap-gift.mp4','vap-gift.json'].map(async name=>new File([await(await fetch('/samples/'+name)).arrayBuffer()],name,{type:name.endsWith('mp4')?'video/mp4':'application/json'})));return files;}
function dispose(){baseline?.video?.pause();baseline?.destroy();baseline=null;fixed?.destroy();fixed=null;urls.forEach(u=>URL.revokeObjectURL(u));urls=[];}
async function load(){dispose();baselineDraws=0;const f=await sample();const src=URL.createObjectURL(f[0]);urls.push(src);baseline=new Vap({container:$('baseline'),src,config:JSON.parse(await f[1].text()),mute:true,loop:true,accurate:false});baseline.on('frame',()=>baselineDraws++);fixed=await videoAdapter(f[0],f,$('fixed'),urls,'VAP');await fixed.play();$('result').textContent='Loaded';}
for(const [id,action]of Object.entries({load,play:async()=>{baseline?.video.play();await fixed?.play();},pause:()=>{baseline?.pause();fixed?.pause();},seek:async()=>{fixed?.pause();await fixed?.seek(5);},snapshot:()=>{fixed?.pause();const canvas=fixed.snapshot().canvas;$('result').textContent=`Snapshot ${canvas.width} × ${canvas.height}`;},replace:async()=>{fixed?.pause();await fixed?.replace('[textUser]','Regression','text');},destroy:dispose}))$(id).onclick=()=>Promise.resolve().then(action).catch(e=>$('result').textContent=e.stack);
setInterval(()=>$('metrics').textContent=JSON.stringify({baseline:{draws:baselineDraws,paused:baseline?.video?.paused,time:baseline?.video?.currentTime},fixed:{...fixed?.getDiagnostics(),time:fixed?.getTime()},videoElements:document.querySelectorAll('video').length},null,2),250);
window.addEventListener('beforeunload',dispose);
</script>
